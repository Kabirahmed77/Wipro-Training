<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCore Finance & Billing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg navbar-dark FinCore-nav shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <i class="bi bi-wallet2 fs-4 me-2 text-info"></i> FinCore Billing
            </a>
            <span class="navbar-text text-light opacity-75 d-none d-md-block">
                Enterprise Operations Dashboard
            </span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row g-4">
            <div class="col-lg-4">
                
                <div class="card border-0 shadow-sm rounded-4 mb-4 invoice-card">
                    <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                        <h5 class="fw-bold mb-0 text-dark">
                            <i class="bi bi-person-plus-fill text-success me-2"></i>Register Customer
                        </h5>
                        <p class="text-muted small mt-1">Required before generating invoices</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="customerForm">
                            <div class="mb-3">
                                <label class="form-label fw-medium text-secondary small">New Customer ID</label>
                                <div class="input-group bg-light rounded-3">
                                    <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-hash"></i></span>
                                    <input type="number" id="newCustId" class="form-control bg-transparent border-0 ps-0" placeholder="e.g. 105" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium text-secondary small">Company Name</label>
                                <div class="input-group bg-light rounded-3">
                                    <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-building"></i></span>
                                    <input type="text" id="newCustName" class="form-control bg-transparent border-0 ps-0" placeholder="e.g. Wipro Ltd" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 shadow-sm">
                                Register to SQL
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4 invoice-card">
                    <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                        <h5 class="fw-bold mb-0 text-dark">
                            <i class="bi bi-plus-circle-fill text-primary me-2"></i>New Invoice
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="invoiceForm">
                            <div class="mb-4">
                                <label class="form-label fw-medium text-secondary small">Registered Customer ID</label>
                                <div class="input-group bg-light rounded-3">
                                    <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-person-check"></i></span>
                                    <input type="number" id="custId" class="form-control bg-transparent border-0 ps-0" placeholder="e.g. 101" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-medium text-secondary small">Amount ($)</label>
                                <div class="input-group bg-light rounded-3">
                                    <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-currency-dollar"></i></span>
                                    <input type="number" step="0.01" id="amount" class="form-control bg-transparent border-0 ps-0" placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-medium text-secondary small">Due Date</label>
                                <div class="input-group bg-light rounded-3">
                                    <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                                    <input type="date" id="dueDate" class="form-control bg-transparent border-0 ps-0" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-medium text-secondary small">Invoice Status</label>
                                <div class="input-group bg-light rounded-3">
                                    <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-info-circle"></i></span>
                                    <select id="statusSelect" class="form-select bg-transparent border-0 ps-0">
                                        <option value="Pending" selected>Pending</option>
                                        <option value="Paid">Paid</option>
                                        <option value="Overdue">Overdue</option>
                                        <option value="Cancelled">Cancelled</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm mt-2">
                                Generate Invoice
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 h-100 invoice-card">
                    <div class="card-header bg-white border-0 pt-4 pb-0 px-4 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-receipt text-success me-2"></i>Recent Transactions</h5>
                        <span class="badge bg-light text-secondary border fw-normal"><i class="bi bi-broadcast me-1"></i>Real-time</span>
                    </div>
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="text-secondary small text-uppercase fw-semibold" style="background-color: #f8fafc;">
                                    <tr>
                                        <th class="ps-3 border-0 rounded-start">Invoice #</th>
                                        <th class="border-0">Customer ID</th>
                                        <th class="border-0">Amount</th>
                                        <th class="border-0">Due Date</th>
                                        <th class="border-0 rounded-end">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="invoiceTableBody" class="border-top-0 border-light">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="invoice.js"></script>
</body>
</html>
